  - title: Selected projects
    type: projects
    page_break_before: true
    introduction: Selected examples; further projects and implementation details are available in the portfolio.
    portfolio:
      label: Portfolio
      value: santerihukari.github.io/projects/
      url: https://santerihukari.github.io/projects/
    items:
      - title: Browser-based parametric CAD
        url: https://santerihukari.github.io/projects/parametric-cad/
        details:
          - Built reusable base models to reduce repeated measurement collection and manual adaptation to different dimensions
          - Developed the app and designs with existing OpenCascade/WebAssembly libraries, JavaScript, and Three.js
          - Users set dimensions in the browser, export an STL, or share a parameterized URL so someone else can reproduce the configuration and print it

      - title: Guacamole multimonitor and multidevice remote access extension
        url: https://santerihukari.github.io/projects/browser-multi-monitor-rdp/
        details:
          - Extended Apache Guacamole for multimonitor and multidevice access to a home GPU desktop from university computers and a laptop
          - The main device dynamically manages remote displays, viewed on the same or other physical devices; default resolution follows the viewing device's browser viewport
          - Implemented view-only QR pairing with a six-digit comparison code and explicit approval by the original controller; currently a private prototype

      - title: 3D boulder topo and photogrammetry
        url: https://santerihukari.github.io/projects/3d-boulder-topo/
        details:
          - Created draft boulder models from mirrorless-camera photographs; coverage is incomplete where photographing angles are restricted
          - Built a Three.js model library and a route-aware SRK topo viewer with manually mapped climbing routes and route-focused camera navigation

      - title: Gallery infrastructure and bib-number search
        url: https://santerihukari.github.io/projects/gallery-infrastructure/
        details:
          - Built Jekyll galleries with local Python tooling for metadata, thumbnails, previews, and links to full-resolution originals
          - Added local bib-number recognition with YOLO detectors, EasyOCR, and Qwen2.5-VL review; experimental, with accuracy not yet evaluated
          - Implemented a separate password-protected Cloudflare-hosted gallery, not yet integrated with the public gallery

  - title: Skills
    type: skill_groups
    groups:
      - title: Software Engineering and Systems
        items:
          - "Python - strong proficiency; PyTorch, OpenCV, NumPy, and Pandas. C++ and MATLAB experience"
          - Algorithms, numerical computing, debugging, testing, automation, and API integration
          - HTML, CSS, JavaScript, PHP, SQL/SQLite, WordPress, Jekyll, and GitHub Pages; responsive UI/UX
          - "Linux - active use since 2013; Git - advanced, regular use; GitHub Actions and deployment automation"
          - "Introductory: React and Node.js; course-level Kotlin, C, R, Scala, Haskell, Lua, and Bash"

      - title: Machine Learning, Data, and Research
        items:
          - Deep learning, CNNs, transformers, computer vision, signal processing, and imitation learning for robotics
          - Forecasting, ensemble modeling, experimental design, benchmarking, and data-leakage-aware validation
          - Scientific writing and technical documentation with LaTeX and Overleaf

      - title: AI-Assisted CAD Engineering
        items:
          - Natural-language requirements to geometry maintained as code; AI-assisted creation, revision, and adaptation between CAD engines for the parametric web application

      - title: Embedded and Physical Systems
        items:
          - ESP8266/ESP32-S3, Teensy 4.1, and Raspberry Pi; sensor integration, data acquisition, and MQTT telemetry
          - Hardware-software integration, protocol reverse engineering, electronics repair, soldering, and fault diagnosis
          - Automotive diagnostics and repair, including brakes and timing belts
          - Bicycle maintenance and wheel building; mechanical assembly and electromechanical troubleshooting

      - title: Geometry, Prototyping, and Photography (since 2025)
        items:
          - Parametric geometry, boundary representation, and STL export using existing CAD libraries
          - Photogrammetry, 3D reconstruction, 3D printing, and iterative physical prototyping
          - Sports and event photography, RAW processing, batch editing, and online image-delivery workflows

