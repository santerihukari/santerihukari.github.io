  - title: Projects and Activities
    type: projects
    items:
      - title: Parametric CAD Tool (Wasm)
        url: https://santerihukari.github.io/stl_param/
        description: Developed a web-based CAD configurator using the OpenCascade kernel compiled to WebAssembly. Supports real-time boundary-representation modeling for generating 3D-printable STLs directly in the browser.

      - title: Bommari bouldering area
        url: https://www.tekiila.fi/en/bommari-en/
        description: Managed the construction of a bouldering area in a bomb shelter on Tampere University's Hervanta campus.

      - title: Home device control system
        description: Built using ESP8266 microcontrollers, relay boards, microphone input, Raspberry Pi, and Telegram and web interfaces.

      - title: Portable fingerboard
        url: https://santerihukari.github.io/stl/
        description: Optimized for minimal plastic use; the latest model uses approximately 25 g of PLA, withstands 70 kg training loads without structural fatigue, and has a wooden finger-contact surface.

      - title: Load-cell data logger
        reference:
          label: Tindeq Progressor-like
          url: https://tindeq.com/product/progressor/
        description: system for finger-strength testing and dynamic load measurement using an HX711 ADC and a 100 kg S-type load cell, operated primarily with an ESP32-S3, with Raspberry Pi and ESP8266 support, and database logging.

      - title: Personal website
        url: https://santerihukari.github.io/
        description: Built with Jekyll and deployed through GitHub Actions, including custom photo galleries, lightbox navigation, downloadable originals, 3D model previews, browser-based parametric CAD, and course filtering.

